    <rect x="7" y="7" width="7" height="7" rx="1.8"/>
    <rect x="17" y="7" width="7" height="7" rx="1.8"/>
    <rect x="7" y="17" width="7" height="7" rx="1.8"/>
  </g>
  <g fill="#7DC242">
    <rect x="19.6" y="17" width="2.8" height="7" rx="1"/>
